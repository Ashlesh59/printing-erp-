<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Print Worker</title>
    <style>
        @page {
            size: auto;
            margin: 0mm;
        }
        body {
            margin: 0;
            padding: 0;
            background: white;
            overflow: hidden;
        }
        .page-container {
            page-break-after: always;
            page-break-inside: avoid;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
        }
        @media print {
            body {
                background: none;
            }
            .page-container {
                page-break-after: always;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="pages-container"></div>

    <script type="module">
        import * as pdfjsLib from '../../node_modules/pdfjs-dist/build/pdf.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = '../../node_modules/pdfjs-dist/build/pdf.worker.mjs';

        if (window.printWorkerAPI) {
            window.printWorkerAPI.onRenderTask(async (taskData) => {
                try {
                    const container = document.getElementById('pages-container');
                    container.innerHTML = '';

                    const options = taskData.options || {};
                    if (options.color === false || options.printType === 'bw') {
                        document.body.style.filter = 'grayscale(100%)';
                    } else {
                        document.body.style.filter = 'none';
                    }

                    let loadingTask;
                    if (taskData.pdfBuffer) {
                        const uint8 = new Uint8Array(taskData.pdfBuffer);
                        loadingTask = pdfjsLib.getDocument({ data: uint8, useSystemFonts: true });
                    } else if (taskData.filePath) {
                        const fileUrl = `app-file:///${taskData.filePath.replace(/\\/g, '/')}`;
                        loadingTask = pdfjsLib.getDocument({ url: fileUrl, useSystemFonts: true });
                    } else {
                        throw new Error('No PDF buffer or file path provided for rendering');
                    }

                    const pdf = await loadingTask.promise;
                    if (pdf.numPages === 0) {
                        throw new Error('Document contains 0 renderable pages');
                    }

                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const viewport = page.getViewport({ scale: 2.0 });

                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page-container';

                        const canvas = document.createElement('canvas');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        pageDiv.appendChild(canvas);
                        container.appendChild(pageDiv);

                        const context = canvas.getContext('2d');
                        await page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise;
                    }

                    // Signal completion to secure main process
                    window.printWorkerAPI.notifyRenderComplete();
                } catch (err) {
                    console.error('Worker rendering error:', err);
                    window.printWorkerAPI.notifyRenderFailed(err.message || String(err));
                }
            });
        }
    </script>
</body>
</html>
